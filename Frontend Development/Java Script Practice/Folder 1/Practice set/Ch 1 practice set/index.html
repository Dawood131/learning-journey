<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // Q # 1

        let age = prompt("Whats your age:")
        if (age > 10 && age < 20) {
            console.log(alert("Your age lies between 10 and 20"))
        }
        else {
            console.log(alert("Your age does not lies between 10 and 20"))
        }

        // Q # 2

        const fruit = prompt("Whats the price of Fruits?")
        switch (fruit) {
            case "apple":
                console.log(alert("The price of apple is 0.50$"))
                break
            case "mango":
                console.log(alert("The price of mango is 0.79$"))
                break
            case "banana":
                console.log(alert("The price of banana is 0.30$"))
                break
            default:
                console.log(alert("I dont have this fruit"))
        }


        // Q # 3

        let num = prompt("Enter your number")
        if (num % 2 && num % 3) {
            console.log(alert("Your num is divisible by 2 and 3"))
        }
        else {
            console.log(alert("Your num is not divisible by 2 and 3"))
        }
        //    Q # 4

        let numb = prompt("Enter your number")
        if (numb % 2 || numb % 3) {
            console.log(alert("your number is divisible by 2"))
        }
        else {
            console.log(alert("your number is divisible by 3"))
        }


        // Q # 5

        let a = prompt("Enter your age")
        let b = a >= 18 ? "you can drive" : "you cannot drive"
        console.log(alert(b))

    </script>
</body>
