<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="User registration page for My Website">
    <meta name="author" content="Your Name">
    <meta name="keywords" content="registration, user, account, sign up">
    <link rel="stylesheet" href="files/regiser.css">
    <title>My WSebsite</title>
</head>

<body>
    <header>
        <h1>Register</h1>
    </header>

    <main>
        <form action="Form.html" method="get">
            <div>
                <label for="username"><b>Username:</b></label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>
            <br>
            <div>
                <label for="email"><b>Email:</b></label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <br>

            <div>
                <label for="password"><b>Password:</b></label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <br>

            <div>
                <label for="confirm-password"><b>Confirm Password:</b></label>
                <input type="password" id="confirm-password" name="confirm-password" required
                    placeholder="Confirm your password">
            </div>
            <button type="submit">Register</button>
            <a href="Form.html"></a>
            </div>




            <div>
               <p><b>Already have an account?</b> <a href="login.html">Login here</a></p>
               <script src="script.js"></script>
            </div>

            <div>
                <p><a href="/terms">Terms of Service</a> | <a href="/privacy">Privacy Policy</a></p>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2023 Your Company. All rights reserved.</p>
    </footer>

</body>

</html>
