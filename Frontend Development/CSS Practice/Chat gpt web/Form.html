<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Travel Agency Booking Form">
    <meta name="author" content="Your Name">
    <meta name="keywords" content="travel, booking, form, agency, hotel, payment">
    <link rel="stylesheet" href="files/Form.css">
    <title>My Website</title>
</head>

<body>
    <header>
        <link rel="stylesheet" href="files/Form.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <h1><big>Travel Agency Booking Form</big></h1><br>
        <hr>
        <h2>Registration Form</h2>
    </header>
    <main>
        <div>
            <form action="https://example.com/submit" method="post">
                <label for="name">Mr/Mrs: </label>
                <input type="text" placeholder="Enter your name" id="name" name="name" required><br><br>

                <label for="email">Email:</label>

                <input type="email" placeholder="Enter your Email" id="email" name="email" required><br><br>
                <label for="password:">Password:</label><input type="password" placeholder="Enter your password"
                    id="password" name="password" required> <br><br>
                <label for="phone">Phone:</label><input type="text" placeholder="Enter your phone number" id="phone"
                    name="phone" required><br><br>
                <label for="address">Address:</label> <input type="text" placeholder="Enter your address" id="address"
                    name="address" required><br><br>
                <label for="destination">Destination:</label>
                <select id="destination" name="destination" required>
                    <option value="" disabled selected>Select your destination</option>
                    <option value="london">London</option>
                    <option value="paris">Paris</option>
                    <option value="newyork">New York</option>
                    <option value="tokyo">Tokyo</option>
                </select><br><br>
                <div>
                    <label for="travel-date">Travel Date:</label>
                    <input type="date" id="travel-date" name="travel-date"><br><br>
                </div>

                <div>
                    <br>
                    <u>
                        <h2>Hotel</h2>
                    </u>
                    <table>
                        <thead>
                            <tr>
                                <th>Room Type</th>
                                <th>Quantity No. of Room</th>
                                <th>Room Rate</th>
                                <th>No. of Person</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><input type="text" name="room-type" placeholder="Enter room type"></td>
                                <td><input type="number" name="room-quantity" placeholder="Enter quantity"></td>
                                <td><input type="number" name="room-rate" placeholder="Enter rate"></td>
                                <td><input type="number" name="no-of-person" placeholder="Enter number of persons"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <br>
                <div>
                    <details>
                        <summary><u>Payment-Method</u></summary>
                        <p>
                        <div>
                            <label for="cashid">
                                <input type="radio" id="cashid" name="payment-method" value="cash" check>Cash
                            </label>
                        </div>
                        <div>
                            <label for="creditid">
                                <input type="radio" id="creditid" name="payment-method" value="credit"> CreditCard
                            </label>
                        </div>
                        <div>
                            <label for="debitid">
                                <input type="radio" id="debitid" name="payment-method" value="debit">DebitCard
                            </label>
                        </div>
                    </details>

                </div>
                <div><button type="submit"><i class="fas fa-paper-plane"></i> Submit</button>
                    <button type="reset"><i class="fas fa-undo"></i> Reset</button>
                    <button type="button" onclick="window.location.href='https://example.com/cancel'"><i
                            class="fas fa-times"></i> Cancel</button>
                </div>
            </form>
        </div>

    </main>
    <footer>
        <p>© 2023 Travel Agency. All rights reserved.</p>
        <p>Follow us on:
            <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
            <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
            <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
        </p>
</body>

</html>
