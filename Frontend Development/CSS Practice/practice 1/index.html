<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="files/style.css">
    <title>Login - DawoodWeb</title>
</head>

<body>
    <main class="login-container">
        <form method="post">
        <div class="a">
            <h1>Login</h1>
            <div class="input-group">
                <input type="text" id="username" class="username" placeholder="Enter Your Name" required>
            </div>
            <div class="input-group">
                <input type="text" id="password" class="password" placeholder="Enter Your Password" required>
            </div>
            <div class="remember">
                <label for="remember">Remember me</label>
                <input type="checkbox" name="remember" id="remember" required>
                <p id="forget" class="forget"><a href="">Forgot Password?</a></p>
                </div>
                <div>
                    <button type="submit" class="login"><a href="mainpage.html">Login</a></button>
                </div>
                <div class="d">
                    <p>Don't have an account: <a href="register.html">Resgister</a></p>
                </div>
            </div>
        </form>
    </main>
    </div>
</body>

</html>
