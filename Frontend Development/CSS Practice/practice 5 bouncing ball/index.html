<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            background-color: blue;
            width: 100vw;
            height: 70vh;
            position: relative;
        }

        .ball {
            background-color: red;
            width: 100px;
            height: 100px;
            border-radius: 400px;
            position: absolute;
            bottom: 0;
            animation: ballx 3s linear infinite alternate, bally 1s ease-out infinite alternate;
        }

        @keyframes ballx {
            0% {
                left: 0;
            }
            33%{
                left: 25%;
                transform: translateX(50%);
                background-color: black;
            }
             66%{
                background-color: rgb(0, 255, 55);
                left: 50%;
                transform: translateX(50%);
            }
            
            100% {
                background-color: rgb(230, 238, 238);
                left: 92%;
                transform: translateX(50%);
            }
        }
 
         @keyframes bally {
            from {
                bottom: 0;
            }

            to {
                bottom: 50%;
                transform: translateY(50%);

            }
          } 
    </style>
</head>

<body>
    <div class="container">
        <div class="ball">

        </div>
    </div>

</body>

</html>
