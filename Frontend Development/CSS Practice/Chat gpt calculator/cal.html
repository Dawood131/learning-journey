<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cal.css">
    <title>Calculator</title>
</head>

<body>
    <div class="container">
        <input type="text" id="display" disabled>
        <div class="button">
            <div><button onclick="clearDisplay()">C</button></div>
            <div><button onclick="append('/')">/</button></div>
            <div><button onclick="append('*')">*</button></div>
            <div><button onclick="deleteLast()">⌫</button></div>
            <div><button onclick="append('7')">7</button></div>
            <div><button onclick="append('8')">8</button></div>
            <div><button onclick="append('9')">9</button></div>
            <div><button onclick="append('-')">-</button></div>
            <div><button onclick="append('4')">4</button></div>
            <div><button onclick="append('5')">5</button></div>
            <div><button onclick="append('6')">6</button></div>
            <div><button onclick="append('+')">+</button></div>
            <div><button onclick="append('1')">1</button></div>
            <div><button onclick="append('2')">2</button></div>
            <div><button onclick="append('3')">3</button></div>
            <div><button onclick="calculate()" class="equal">=</button></div>
            <div><button onclick="append('%')">%</button></div>
            <div><button onclick="append('0')" class="zero">0</button></div>
            <div><button onclick="append('.')">.</button></div>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
