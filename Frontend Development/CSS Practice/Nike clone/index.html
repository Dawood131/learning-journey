<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="images/download.png" type="image/x-icon">
    <link rel="stylesheet" href="animation-utilities-extended.css">
    <title>Nike. Just Do It. Nike UK </title>
</head>

<body>
    <header>
        <div class="upnav fade-in">
            <div class="navleft fade-right">
                <img src="images/Nike-Logo-History-4-1200x750.png" alt="" height="18">
            </div>
            <div class="navright fade-up">
                <nav>
                    <ul>
                        <li>Find a store |</li>
                        <li>Help |</li>
                        <li>Join us |</li>
                        <li>Sign in</li>
                    </ul>
                </nav>
            </div>
        </div>
        <div class="downnav fade-up">
            <div class="navleft2 fade-right">
                <img src="images/download.png" alt="" width="50">
            </div>
            <div class="navcenter fade-up">
                <ul>
                    <li>New</li>
                    <li>Men</li>
                    <li>Women</li>
                    <li>Kids</li>
                    <li>Sport</li>
                    <li>Sportwear</li>
                </ul>
            </div>
            <div class="navright2 fade-left">
                <span><img src="icons/search.png" alt="" width="20"></span>
                <span><input type="text" name="search" id="search" placeholder="Search"></span>
                <span><img src="icons/heart.png" alt="" width="20"></span>
                <span><img src="icons/shopping-bag.png" alt="" width="20"></span>
            </div>
        </div>
    </header>
    <main>
        <section class="sec1 ani-riseFade ">
            <iframe class="ani-riseFade" height="465"
                src="https://www.youtube.com/embed/Bcpu-jqAL6w?si=7ZDbqTe721m2Hb3w" title="YouTube video player"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <div class="only ani-riseFade ">
                <h5>Only One way to find out.</h5>
            </div>
            <div class="just fade-up">
                <h1>JUST DO IT.</h1>
            </div>
            <div class="btn ">
                <span><button class="slide-left btn-press">Shop</button></span>
                <span><button class="slide-right btn-press">Watch</button></span>
            </div>
        </section>

        <section class="sec2 fade-up">
            <div><h1>Shop by Sport</h1></div>
            <span><img src="images/nike-just-do-it (1).jpg" alt=""></span>
            <span><img src="images/nike-just-do-it (1).png" alt=""></span>
            <span><img src="images/nike-just-do-it (2).png" alt=""></span>
            <span><img src="images/nike-just-do-it (3).png" alt=""></span>
            <span><img src="images/nike-just-do-it (4).png" alt=""></span>
            <span><img src="images/nike-just-do-it (5).png" alt=""></span>
        </section>
    </main>
</body>

</html>
