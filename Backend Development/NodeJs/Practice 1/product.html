<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Product Detail</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #333;
      text-decoration: none;
    }

    #status {
      text-align: center;
      color: #666;
    }

    .product-box {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
    }

    .product-box img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    .product-info {
      padding: 20px;
    }

    .product-info h2 {
      margin: 0 0 10px;
    }

    .product-info .category {
      color: #888;
      font-size: 13px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .product-info .price {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .product-info .discount {
      color: #d00;
      font-size: 14px;
    }

    .product-info .description {
      margin-top: 15px;
      color: #444;
      line-height: 1.5;
    }

    .product-info .meta {
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

  <a class="back-link" href="/products">&larr; Back to products</a>

  <div id="status">Loading product...</div>
  <div class="product-box" id="productBox" style="display:none"></div>

  <script>
    const API_BASE = 'http://localhost:8000';
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    const statusEl = document.getElementById('status');
    const boxEl = document.getElementById('productBox');

    async function loadProduct() {
      try {
        const res = await fetch(`${API_BASE}/api/products?id=${id}`);
        const p = await res.json();

        if (!p) {
          statusEl.textContent = 'Product not found.';
          return;
        }

        statusEl.style.display = 'none';
        boxEl.style.display = 'block';
        boxEl.innerHTML = `
        <img src="${p.image}" alt="${p.name}">
        <div class="product-info">
          <div class="category">${p.category}</div>
          <h2>${p.name}</h2>
          <div class="price">Rs. ${p.price}</div>
          <div class="discount">${p.discount}% off</div>
          <p class="description">${p.description}</p>
          <div class="meta">Rating: ${p.rating} &nbsp;|&nbsp; Stock: ${p.stock}</div>
        </div>
      `;
      } catch (err) {
        console.error('Error loading product:', err);
        statusEl.textContent = 'Could not load product. Is your server running?';
      }
    }

    loadProduct();
  </script>

</body>

</html>
