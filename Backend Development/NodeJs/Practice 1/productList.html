<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Products</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #333;
      text-decoration: none;
    }

    #status {
      text-align: center;
      color: #666;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      max-width: 1000px;
      margin: 20px auto;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      width: 220px;
      overflow: hidden;
      text-decoration: none;
      color: black;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-body {
      padding: 10px;
    }

    .card h3 {
      font-size: 15px;
      margin: 0 0 6px;
    }

    .card .price {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Product List</h1>
  <a class="back-link" href="/">&larr; Back to Home</a>
  <div id="status">Loading products...</div>
  <div class="grid" id="grid"></div>

  <script>
    const API_BASE = 'http://localhost:8000';

    async function loadProducts() {
      try {
        const res = await fetch(`${API_BASE}/api/products`);
        const products = await res.json();
        document.getElementById('status').style.display = 'none';

        const grid = document.getElementById('grid');
        products.forEach(p => {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = `/products?id=${p.id}`;
          card.innerHTML = `
          <img src="${p.image}" alt="${p.name}">
          <div class="card-body">
            <h3>${p.name}</h3>
            <div class="price">Rs. ${p.price}</div>
          </div>
        `;
          grid.appendChild(card);
        });
      } catch (err) {
        document.getElementById('status').textContent = 'Could not load products. Is your server running?';
      }
    }

    loadProducts();
  </script>

</body>

</html>
