<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Store</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .box {
    background: white;
    padding: 40px 50px;
    border-radius: 10px;
    border: 1px solid #ddd;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  h1 { margin: 0 0 10px; color: #222; }
  p { color: #666; margin-bottom: 20px; }
  a {
    display: inline-block;
    background: #222;
    color: white;
    padding: 10px 24px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
  }
  a:hover { background: #444; }
</style>
</head>
<body>
  <div class="box">
    <h1>Welcome to My Store</h1>
    <p>Best products at best prices.</p>
    <a href="/products">View Products</a>
  </div>
</body>
</html>
